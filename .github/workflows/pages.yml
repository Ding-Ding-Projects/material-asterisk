name: Compose and publish Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-pages:
    name: Compose and publish the documentation site
    runs-on: windows-2025
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          # Deep enough to hold the commits the changelog links to.
          #
          # The default is one commit, and console/site/build.mjs verifies every commit
          # the changelog references before it will emit a link to it. In a one-commit
          # clone every one of them is absent, so the build correctly declines to link
          # any of them and the published changelog loses its commit links entirely.
          #
          # The referenced commits are the ones between the last twenty release tags,
          # which sit a few commits apart, so this is far more than enough. It is a
          # bounded number rather than 0 because full history on this repository is
          # large and this job does not otherwise need it. If it ever were not enough,
          # build.mjs treats an unverifiable commit in a shallow clone as exactly that
          # -- links dropped, reason printed -- rather than failing the deploy.
          fetch-depth: 200
      - name: Bootstrap site build dependencies
        shell: cmd
        run: download-dependencies.bat /s
      - name: Resolve the newest verified installer download
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Never blocks the Pages deploy: the site's own fallback below is honest
          # and correct when no verified release manifest can be resolved, so a
          # failure here is recorded as evidence rather than failing this step.
          $nodeRecord = (Get-Content -Raw dependency-manifest.json | ConvertFrom-Json).dependencies | Where-Object id -eq 'node-win-x64'
          $node = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "DingPBX\toolchains\$($nodeRecord.archiveRoot)\node.exe"
          & $node console/scripts/resolve-site-download-manifest.mjs --out console/site/release-manifest.local.json
      - name: Compose the static Pages tree
        shell: powershell
        run: |
          $nodeRecord = (Get-Content -Raw dependency-manifest.json | ConvertFrom-Json).dependencies | Where-Object id -eq 'node-win-x64'
          $node = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "DingPBX\toolchains\$($nodeRecord.archiveRoot)\node.exe"
          & $node console/site/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'console/site/dist/index.html')) { throw 'compose-site did not create console/site/dist/index.html' }
          if (-not (Test-Path -LiteralPath 'console/site/dist/build-manifest.json')) { throw 'compose-site did not create console/site/dist/build-manifest.json' }
      - name: Independently verify search-index directives
        shell: powershell
        run: |
          py -3 console/site/verify_pages_noindex.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 console/site/verify_pages_noindex.py console/site/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: console/site/dist
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Record Pages evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $download = $null
          if (Test-Path -LiteralPath 'console/site/dist/build-manifest.json') {
            $download = (Get-Content -Raw console/site/dist/build-manifest.json | ConvertFrom-Json).download
          }
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            pageUrl = '${{ steps.deploy.outputs.page_url }}'
            runner = '${{ runner.name }}'
            download = $download
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 evidence/pages.json
      - name: Upload Pages evidence even after a deployment failure
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pages-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/pages.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload composed Pages output even after a failure
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pages-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/site/dist/**
          if-no-files-found: warn
          retention-days: 7
